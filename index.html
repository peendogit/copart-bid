<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5fd6">
<title>Moji Copart bidovi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#16223a;--mut:#6b7891;--line:#e3e8f2;--pri:#1e5fd6;--pri2:#e8f0ff;--acc:#ff8a1f;--ok:#1aa35c;--okbg:#e5f7ed;--bad:#d94141;--badbg:#fdeaea;--warnbg:#fff4e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1e5fd6,#3b7bf0);color:#fff;padding:14px 16px 0;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0 0 10px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:transparent;border:0;color:#d6e3ff;font-weight:600;padding:10px 4px 12px;font-size:14px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-color:var(--acc)}
main{padding:14px 14px 110px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(20,40,90,.07);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri)}
label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;background:var(--pri2);color:var(--pri);cursor:pointer}
.btn.p{background:var(--pri);color:#fff}.btn.a{background:var(--acc);color:#fff}.btn.r{background:var(--badbg);color:var(--bad)}.btn.g{background:var(--okbg);color:var(--ok)}
.btn.sm{padding:8px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--mut)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.bid{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.bid img,.bid .noimg{width:86px;height:86px;border-radius:12px;object-fit:cover;flex:none;background:#dfe6f3}
.bid .noimg{display:flex;align-items:center;justify-content:center;font-size:30px}
.bid h3{margin:0 0 2px;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12.5px;color:var(--mut)}
.big{font-size:16px;font-weight:800}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--pri2);color:var(--pri)}
.badge.dobio{background:var(--okbg);color:var(--ok)}.badge.izgubio{background:var(--badbg);color:var(--bad)}.badge.zavrseno{background:var(--warnbg);color:#b86200}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(20,40,90,.07)}
.sum b{display:block;font-size:20px}.sum span{font-size:11.5px;color:var(--mut);font-weight:600}
.fab{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;max-width:692px;margin:0 auto;z-index:6}
.fab .btn{flex:1;padding:15px;font-size:15px;box-shadow:0 6px 18px rgba(30,95,214,.3)}
table.calc{width:100%;border-collapse:collapse;font-size:14px}
table.calc td{padding:6px 2px;border-bottom:1px solid var(--line)}
table.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.calc tr.tot td{font-weight:800;border-bottom:0;font-size:15px}
table.calc tr.hl td{background:#fff7d6}
h2{font-size:15px;margin:2px 0 8px}
.res{background:linear-gradient(135deg,#fff3e3,#fff);border:1.5px solid #ffd4a8;border-radius:14px;padding:12px;margin-top:10px}
.res .v{font-size:24px;font-weight:800;color:#c95f00}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty div{font-size:46px}
dialog{border:0;padding:0;width:100%;max-width:720px;max-height:100%;height:100%;margin:0 auto;background:var(--bg)}
dialog::backdrop{background:rgba(10,20,40,.5)}
.dh{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);z-index:2}
.dh b{flex:1;font-size:16px}
.db{padding:14px 14px 40px}
.photo{width:100%;border-radius:14px;display:block;margin-bottom:10px;background:#dfe6f3}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.check input{width:22px;height:22px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat button{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;color:var(--mut)}
.stat button.on[data-s=aktivan]{background:var(--pri);border-color:var(--pri);color:#fff}
.stat button.on[data-s=dobio]{background:var(--ok);border-color:var(--ok);color:#fff}
.stat button.on[data-s=izgubio]{background:var(--bad);border-color:var(--bad);color:#fff}
.note{font-size:12.5px;color:var(--mut);margin-top:6px}
.warn{background:var(--warnbg);color:#8a4b00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16223a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.kv{display:flex;gap:8px;margin-bottom:6px}.kv input{padding:8px 10px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🚗 Moji Copart bidovi</h1>
  <nav class="tabs">
    <button data-tab="bidovi" class="on">Bidovi</button>
    <button data-tab="kalk">Kalkulator</button>
    <button data-tab="pod">Podešavanja</button>
  </nav>
</header>

<main>
  <!-- BIDOVI -->
  <section id="t-bidovi">
    <div class="sum" id="sum"></div>
    <input id="q" type="search" inputmode="numeric" placeholder="🔎 Pretraži po broju lota ili vozilu">
    <div id="lotHit"></div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="aktivni">Aktivni</button>
      <button class="chip" data-f="dobio">Dobijeni</button>
      <button class="chip" data-f="izgubio">Izgubljeni</button>
      <button class="chip" data-f="svi">Svi</button>
    </div>
    <div id="lista"></div>
  </section>

  <!-- KALKULATOR -->
  <section id="t-kalk" class="hide">
    <div class="card">
      <h2>Bid → cijena ispred kuće</h2>
      <div class="g2">
        <div><label>Bid na Copartu (£)</label><input id="kBid" type="number" inputmode="decimal" placeholder="npr. 300"></div>
        <div><label>Lokacija</label><select id="kLok"></select></div>
      </div>
      <label class="check"><input type="checkbox" id="kVat"> +20% VAT na cijenu auta</label>
      <div id="kRes"></div>
    </div>
    <div class="card">
      <h2>Koliko najviše smijem dati?</h2>
      <div class="g2">
        <div><label>Ciljna cijena ispred kuće</label><input id="rCilj" type="number" inputmode="decimal" placeholder="npr. 4000"></div>
        <div><label>Valuta</label><select id="rVal"><option value="KM">KM</option><option value="EUR">€</option></select></div>
      </div>
      <p class="note">Koristi lokaciju i VAT iz kartice iznad.</p>
      <div id="rRes"></div>
    </div>
  </section>

  <!-- PODEŠAVANJA -->
  <section id="t-pod" class="hide">
    <div class="card">
      <h2>Tvoja tabela (Excel)</h2>
      <div class="g2" id="podExcel"></div>
      <p class="note">Bankovni tečaj = keš tečaj + razlika. Tečaj za carinu = keš tečaj (kao u Excelu).</p>
    </div>
    <div class="card">
      <h2>Copart provizije</h2>
      <div class="g2" id="podCopart"></div>
      <label>Buyer fee tabela (bid £ → fee £) — između tačaka računa proporcionalno</label>
      <div id="podBuyer"></div>
      <button class="btn sm" id="addBuyer">+ Dodaj tačku</button>
      <label>Internet bid fee (od bida £ → fee £)</label>
      <div id="podNet"></div>
      <button class="btn sm" id="addNet">+ Dodaj raspon</button>
    </div>
    <div class="card">
      <h2>Transport do Globala (£)</h2>
      <div id="podTr"></div>
      <button class="btn sm" id="addTr">+ Dodaj lokaciju</button>
      <label>Nepoznata lokacija (£)</label><input type="number" id="trDef">
    </div>
    <div class="card">
      <h2>Brisanje i backup</h2>
      <label>Brisanje bidova (osim dobijenih) dana nakon aukcije</label><input type="number" id="delDays">
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn p" id="exp">⬇️ Izvezi backup</button>
        <button class="btn" id="impBtn">⬆️ Uvezi backup</button>
        <input type="file" id="imp" accept=".json,application/json" class="hide">
      </div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap">
        <button class="btn sm" id="resetSet">Vrati podešavanja na početna</button>
        <button class="btn sm r" id="wipe">Obriši sve bidove</button>
      </div>
      <p class="note" id="storeInfo"></p>
    </div>
  </section>
</main>

<div class="fab" id="fab">
  <button class="btn a" id="addImg">📷 Dodaj sa slike</button>
  <button class="btn p" id="addMan" style="flex:.6">✍️ Ručno</button>
</div>
<input type="file" id="imgIn" accept="image/*" class="hide">

<dialog id="dlg">
  <div class="dh"><button class="btn sm" id="dClose">✕</button><b id="dTitle">Bid</b><button class="btn sm p" id="dSave">Sačuvaj</button></div>
  <div class="db" id="dBody"></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
<script>
// ===== JEZGRO: podešavanja, obračun, čitanje teksta sa slike =====

const DEFAULT_SETTINGS = {
  // Copart provizije
  buyerFee: [[100, 35], [150, 45], [300, 75], [500, 105], [800, 155], [1000, 175], [1500, 225], [2000, 270], [3000, 350]],
  internetFee: [[0, 0], [100, 35], [500, 49], [1000, 69], [1500, 79], [2000, 89], [4000, 99]],
  lotRetrieval: 50,
  ukVat: 20,
  // Tvoja Excel tabela
  globalBank: 150,
  globalCash: 100,
  tecajCash: 1.15,
  tecajBankRazlika: 0.05,
  prijevozBank: 250,
  prijevozCash: 250,
  homologacija: 80,
  ostali: 90,
  carinaPosto: 15,
  pdvPosto: 17,
  osnovicaDodatak: 15,
  bankFaktor: 1.12,
  kesDijelilac: 1.17,
  kesDodatak: 10,
  kmKurs: 1.955,
  // Transport do Globala po Copart lokaciji (£)
  transport: {
    'BRISTOL': 250, 'CHESTER': 250, 'COLCHESTER': 250, 'CORBY': 190, 'EAST KILBRIDE': 400,
    'NEWBURY': 250, 'PETERLEE': 250, 'ROCHFORD': 250, 'SKELMERSDALE': 250, 'SANDTOFT': 140,
    'SANDY': 200, 'SANDWICH': 300, 'WISBECH': 150, 'WHITBURN': 400, 'WOLVERHAMPTON': 230,
    'YORK': 200, 'BELFAST': 500, 'ST HELENS': 250, 'WESTBURY': 250
  },
  transportDefault: 250,
  obrisiPoslijeDana: 3
};

function interp(points, x) {
  const p = points.slice().sort((a, b) => a[0] - b[0]);
  if (!p.length) return 0;
  if (x <= p[0][0]) return p[0][0] > 0 ? p[0][1] * x / p[0][0] : p[0][1];
  for (let i = 1; i < p.length; i++) {
    if (x <= p[i][0]) {
      const [x0, y0] = p[i - 1], [x1, y1] = p[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
  }
  if (p.length === 1) return p[0][1];
  const [x0, y0] = p[p.length - 2], [x1, y1] = p[p.length - 1];
  return y1 + (y1 - y0) / (x1 - x0) * (x - x1);
}

function tier(tiers, x) {
  const t = tiers.slice().sort((a, b) => a[0] - b[0]);
  let f = 0;
  for (const [od, fee] of t) if (x >= od) f = fee;
  return f;
}

// Copart: bid -> ukupno za platiti Copartu (£)
function copartObracun(bid, vatNaCijenu, S, stvarniBuyerFee) {
  bid = +bid || 0;
  const buyer = stvarniBuyerFee != null && stvarniBuyerFee !== '' ? +stvarniBuyerFee : Math.round(interp(S.buyerFee, bid));
  const retrieval = bid > 0 ? +S.lotRetrieval : 0;
  const internet = tier(S.internetFee, bid);
  const vatStopa = S.ukVat / 100;
  const vatProvizije = (buyer + retrieval + internet) * vatStopa;
  const vatCijena = vatNaCijenu ? bid * vatStopa : 0;
  const vat = vatProvizije + vatCijena;
  const total = bid + buyer + retrieval + internet + vat;
  return { bid, buyer, retrieval, internet, vat, total };
}

function transportZa(lokacija, S) {
  const k = (lokacija || '').trim().toUpperCase();
  if (k && S.transport[k] != null) return { iznos: +S.transport[k], poznata: true };
  return { iznos: +S.transportDefault, poznata: false };
}

// Tvoja Excel tabela: Copart total (£) -> € / KM
function excelObracun(copartTotal, transportGlobal, S) {
  const C3 = +copartTotal, C4 = +S.globalBank, C5 = +S.globalCash, C6 = +transportGlobal;
  const cash = +S.tecajCash, bank = cash + +S.tecajBankRazlika, carinaT = cash;
  const C10 = (C3 + C4) * bank + (C5 + C6) * cash;
  const C11 = +S.prijevozBank, C12 = +S.prijevozCash, C13 = +S.homologacija, C15 = +S.ostali;
  const osnovica = (C3 + C4) * carinaT + C11 + +S.osnovicaDodatak;
  const carina = osnovica * S.carinaPosto / 100;
  const osnovicaPdv = osnovica + carina;
  const pdv = osnovicaPdv * S.pdvPosto / 100;
  const ispredKuce = C10 + C11 + C12 + C13 + carina + C15;
  const uplataBank = (osnovica + carina + pdv) * S.bankFaktor + C13;
  const kes = ispredKuce - uplataBank / S.kesDijelilac + +S.kesDodatak;
  const km = +S.kmKurs;
  return {
    tecajBank: bank, uEngleskoj: C10, prijevozBank: C11, prijevozCash: C12, homologacija: C13,
    carina, ostali: C15, ispredKuce, ispredKuceKM: ispredKuce * km,
    osnovica, osnovicaPdv, pdv, carinaPdv: carina + pdv,
    uplataBank, uplataBankKM: uplataBank * km, kes, kesKM: kes * km,
    ukupno: uplataBank + kes, ukupnoKM: (uplataBank + kes) * km
  };
}

function punObracun(bid, vatNaCijenu, lokacija, S, stvarniBuyerFee) {
  const c = copartObracun(bid, vatNaCijenu, S, stvarniBuyerFee);
  const t = transportZa(lokacija, S);
  const e = excelObracun(c.total, t.iznos, S);
  return { copart: c, transport: t, excel: e };
}

// Obrnuto: koliko najviše smijem bidovati za ciljnu cijenu ispred kuće (€)
function maxBidZa(ciljEur, vatNaCijenu, lokacija, S) {
  let best = null;
  for (let b = 5; b <= 30000; b += 5) {
    const r = punObracun(b, vatNaCijenu, lokacija, S);
    if (r.excel.ispredKuce <= ciljEur) best = b;
  }
  return best;
}

// ===== Čitanje teksta sa Copart slike =====
const MJESECI = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function ukDst(y, m, d) {
  // BST: od zadnje nedjelje u martu do zadnje nedjelje u oktobru
  const zadnjaNed = mj => { const t = new Date(Date.UTC(y, mj, 0)); return t.getUTCDate() - t.getUTCDay(); };
  if (m < 3 || m > 10) return 0;
  if (m > 3 && m < 10) return 1;
  if (m === 3) return d >= zadnjaNed(3) ? 1 : 0;
  return d < zadnjaNed(10) ? 1 : 0;
}

function brojIz(s) { return s == null ? null : +String(s).replace(/[,\s]/g, ''); }

function procitajCopart(text, poznateLokacije) {
  const raw = text || '';
  const t = raw.replace(/\r/g, '');
  const r = { lot: null, vozilo: null, lokacija: null, datumUtc: null, imaVrijeme: false, maxBid: null, trenutniBid: null, vatNaCijenu: false, winning: false };

  // Lot
  let m = t.match(/Lot\s*(?:number|no\.?|#|n[o0]\.?)?\s*[:#]?\s*([0-9OoIlS]{8})(?![0-9])/i);
  if (m) r.lot = m[1].replace(/[Oo]/g, '0').replace(/[Il]/g, '1').replace(/S/g, '5');
  if (!r.lot) { m = t.match(/(?<![0-9\/.])([0-9]{8})(?![0-9])/); if (m) r.lot = m[1]; }

  // Vozilo
  const lines = t.split('\n').map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    const vm = L.match(/^[^0-9A-Za-z]*((?:19|20)\d{2}\s+[A-Z][A-Z0-9\-]{1,}(?:\s+.*)?)$/);
    if (vm && !/sale|date|lot|vin|nov|bid/i.test(L.slice(0, 12))) {
      let v = vm[1];
      const next = lines[i + 1];
      v = v.split(/\s+(?:Sale\s*name|Sale\s*date|Lot\s*(?:number|#)|VIN)\b/i)[0];
      if (next && /^[A-Z0-9][A-Z0-9 .\-\/]+$/.test(next) && !/^LOT\b/i.test(next) && next.length < 40 && v.length < 34) {
        v = v.replace(/[^\w.\-\/ ]+/g, ' ').replace(/(\s+[A-Za-z]{1,2})+\s*$/, '');
        v += ' ' + next;
      }
      v = v.replace(/[^\w.\-\/ ]+/g, ' ').replace(/(\s+[A-Za-z@]){1,3}\s*$/, '').replace(/\s+/g, ' ').trim();
      r.vozilo = v;
      break;
    }
  }

  // Lokacija
  const lok = (poznateLokacije || []).map(x => x.toUpperCase()).sort((a, b) => b.length - a.length);
  const normLok = c => {
    if (!c) return null;
    c = c.toUpperCase().replace(/[^A-Z .']/g, ' ').replace(/\s+/g, ' ').trim();
    if (!c || c.length < 3) return null;
    if (lok.includes(c)) return c;
    const pocinje = lok.filter(k => k.startsWith(c));
    if (pocinje.length === 1) return pocinje[0];
    const sadrzi = lok.find(k => c.startsWith(k));
    if (sadrzi) return sadrzi;
    return c;
  };
  const kandidati = [];
  m = t.match(/\d{8}\s*[|lI!]\s*([A-Z][A-Z .']{2,}?)\s*[|lI!]/); if (m) kandidati.push(m[1]);
  m = t.match(/Sale\s*name\s*[:;]?\s*([A-Z][A-Z .']{2,}?)(?=\s*[-·•.,]|\s+Sale|\s*$|\n)/i); if (m) kandidati.push(m[1]);
  m = t.match(/(?<!Your\s)Location\s*[:;]\s*([A-Z][A-Z .']{2,})/); if (m && !/^BIH/.test(m[1])) kandidati.push(m[1]);
  for (const c of kandidati) { const n = normLok(c); if (n) { r.lokacija = n; break; } }
  if (!r.lokacija) {
    const T = t.toUpperCase();
    for (const k of lok) {
      const re = new RegExp('(^|[^A-Z])' + k.replace(/[.']/g, '\\$&') + '([^A-Z]|$)');
      if (re.test(T)) { r.lokacija = k; break; }
    }
  }

  // Datum i vrijeme aukcije
  let y, mo, d, idx = -1;
  m = t.match(/Sale\s*Date\s*[:;]?\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})/i) || t.match(/(\d{1,2})\/(\d{1,2})\/(20\d{2})/);
  if (m) { d = +m[1]; mo = +m[2]; y = +m[3]; idx = m.index; }
  if (!y) {
    m = t.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2}),?\s+(20\d{2})/i);
    if (m) { mo = MJESECI[m[1].toLowerCase().slice(0, 3)]; d = +m[2]; y = +m[3]; idx = m.index; }
  }
  if (y && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
    let h = 12, min = 0, off = null;
    const rest = idx >= 0 ? t.slice(idx) : t;
    const tm = rest.match(/(\d{1,2})[:.](\d{2})\s*(AM|PM)\s*(BST|GMT\s*[+\-#]\s*\d{1,2}|GMT|CEST|CET|UTC)?/i)
      || t.match(/Sale\s*Time\s*[:;]?\s*(\d{1,2})[:.](\d{2})\s*(AM|PM|A[l1I]|P[l1I])?\s*(BST|GMT\s*[+\-#]\s*\d{1,2}|GMT|CEST|CET|UTC)?/i);
    if (tm) {
      h = +tm[1]; min = +tm[2];
      const ap = (tm[3] || '').toUpperCase().replace(/^A.$/, 'AM').replace(/^P.$/, 'PM');
      if (ap === 'PM' && h < 12) h += 12;
      if (ap === 'AM' && h === 12) h = 0;
      const z = (tm[4] || '').toUpperCase().replace(/\s/g, '').replace('#', '+');
      if (z === 'BST' || z === 'CET') off = 1;
      else if (z === 'CEST') off = 2;
      else if (z === 'GMT' || z === 'UTC') off = 0;
      else if (/^GMT[+\-]\d+$/.test(z)) off = +z.slice(3);
      r.imaVrijeme = true;
    }
    if (off == null) off = ukDst(y, mo, d);
    r.datumUtc = new Date(Date.UTC(y, mo - 1, d, h - off, min)).toISOString();
  }

  // Bidovi
  const nemaBida = /haven.?t\s*bid/i.test(t);
  m = t.match(/(?:Your\s*Max\s*Bid|Max(?:imum)?\s*bid)\s*[:;i©®ⓘ()]*\s*[£E€fF]?\s*([\d][\d,]*)/i);
  if (m && !nemaBida) r.maxBid = brojIz(m[1]);
  m = t.match(/Current\s*bid\s*[:;]?\s*\n?\s*[£E€fF]?\s*([\d][\d,]*)/i);
  if (m) r.trenutniBid = brojIz(m[1]);

  r.vatNaCijenu = /\+?\s*20\s*%\s*[A-Za-z]{2,4}\s*applies/i.test(t) || /VAT\s*to\s*be\s*added\s*to\s*final\s*price\s*[:;]?\s*Yes/i.test(t);
  r.winning = /\bWinning\b/.test(t);
  return r;
}

const $ = s => document.querySelector(s);
const fmt = (n, dec = 0) => { if (n == null || isNaN(n)) return '–'; const s = (+n).toFixed(dec).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return s.join(','); };
const eur = n => fmt(n) + ' €', km = n => fmt(n) + ' KM', gbp = (n, d) => '£' + fmt(n, d || 0);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m, ms = 2500) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); }
const pad = n => String(n).padStart(2, '0');
const datumTxt = iso => { if (!iso) return '–'; const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// ===== BAZA (IndexedDB) =====
let DB;
function openDB() { return new Promise((res, rej) => { const r = indexedDB.open('copartBidovi', 1); r.onupgradeneeded = () => r.result.createObjectStore('bidovi', { keyPath: 'id' }); r.onsuccess = () => { DB = r.result; res(); }; r.onerror = () => rej(r.error); }); }
const tx = (mode, fn) => new Promise((res, rej) => { const t = DB.transaction('bidovi', mode); const st = t.objectStore('bidovi'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); });
const svi = () => tx('readonly', st => st.getAll());
const sacuvaj = b => tx('readwrite', st => st.put(b));
const obrisi = id => tx('readwrite', st => st.delete(id));
let BIDOVI = [];

async function ucitaj() { BIDOVI = await svi(); }

// Automatsko brisanje 3 dana nakon aukcije (dobijena ostaju)
async function auto_brisanje() {
  const granica = Date.now() - (+S.obrisiPoslijeDana || 3) * 864e5;
  let n = 0;
  for (const b of BIDOVI) {
    if (b.status !== 'dobio' && b.datumUtc && new Date(b.datumUtc).getTime() < granica) { await obrisi(b.id); n++; }
  }
  if (n) { await ucitaj(); toast(`Obrisano ${n} starih bidova (prošla aukcija)`); }
}

function odbrojavanje(iso) {
  if (!iso) return { txt: 'bez datuma', prosla: false };
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) {
    const brise = new Date(iso).getTime() + (+S.obrisiPoslijeDana) * 864e5 - Date.now();
    return { txt: 'Aukcija završena', prosla: true, brise: Math.max(0, Math.ceil(brise / 864e5)) };
  }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return { txt: d ? `za ${d}d ${h}h` : h ? `za ${h}h ${m}min` : `za ${m} min`, prosla: false };
}

function render() {

  $('#lista').innerHTML = arr.map(b => {

        <div class="meta">📅 ${datumTxt(b.datumUtc)} · ${o.txt}${o.prosla && b.status !== 'dobio' ? ` · briše se za ${o.brise}d` : ''}</div>
        <div class="row" style="margin-top:4px;justify-content:space-between">
          <span class="big">${b.status === 'dobio' && b.konacnaCijena ? gbp(b.konacnaCijena) : b.maxBid ? 'max ' + gbp(b.maxBid) : '–'}</span>

      </div></div>`;
  }).join('');
  document.querySelectorAll('.bid').forEach(el => el.onclick = () => otvori(BIDOVI.find(b => b.id === el.dataset.id)));

  const t = $('#fLokTr') && +$('#fLokTr').value;
  if (cur.lokacija && S.transport[cur.lokacija] == null && t > 0) { S.transport[cur.lokacija] = t; saveS(); }
  // stvarni buyer fee -> u tabelu
  if (cur.status === 'dobio' && cur.konacnaCijena > 0 && cur.stvarniBuyerFee > 0) {
    S.buyerFee = S.buyerFee.filter(p => p[0] !== +cur.konacnaCijena);
    S.buyerFee.push([+cur.konacnaCijena, +cur.stvarniBuyerFee]);
    S.buyerFee.sort((a, b) => a[0] - b[0]); saveS();
  }
  const b = Object.assign({}, cur); delete b._novo; delete b._ocrWarn;
  await sacuvaj(b); await ucitaj(); render(); $('#dlg').close(); toast('Sačuvano ✅');
};

function kalendar(b) {
  if (!b.datumUtc) { toast('Prvo upiši datum aukcije'); return; }
  const s = new Date(new Date(b.datumUtc).getTime() - 15 * 6e4), e = new Date(b.datumUtc);
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Copart aukcija: ' + (b.vozilo || b.lot))
    + '&dates=' + f(s) + '/' + f(e)
    + '&details=' + encodeURIComponent(`Lot ${b.lot || ''} · ${b.lokacija || ''}\nMoj max bid: £${b.maxBid ?? '-'}\nhttps://www.copart.co.uk/lot/${b.lot || ''}`);
  window.open(url, '_blank');
}

// ===== DODAVANJE =====
const prazan = () => ({ id: uid(), lot: '', vozilo: '', lokacija: '', maxBid: null, datumUtc: null, vatNaCijenu: false, status: 'aktivan', konacnaCijena: null, stvarniBuyerFee: null, napomena: '', slika: null, createdAt: new Date().toISOString() });
$('#addMan').onclick = () => otvori(prazan(), true);
$('#addImg').onclick = () => $('#imgIn').click();
$('#imgIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) obradiSliku(f); };

function ucitajSliku(blob) { return new Promise((res, rej) => { const u = URL.createObjectURL(blob); const i = new Image(); i.onload = () => { res(i); }; i.onerror = rej; i.src = u; }); }
function canvasIz(img, max, gray) {
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  if (gray) {
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) { let g = .299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]; g = Math.max(0, Math.min(255, (g - 128) * 1.35 + 128)); p[i] = p[i + 1] = p[i + 2] = g; }
    x.putImageData(d, 0, 0);
  }
  return c;
}

let worker = null;
async function ocr(canvas, onProg) {
  if (typeof Tesseract === 'undefined') throw new Error('nema-ocr');
  if (!worker) worker = await Tesseract.createWorker('eng', 1, { logger: m => { if (m.status === 'recognizing text') onProg(m.progress); else onProg(-1, m.status); } });
  const { data } = await worker.recognize(canvas);
  return data.text;
}

async function obradiSliku(file) {
  const b = prazan();
  $('#dTitle').textContent = 'Čitam sliku…';
  $('#dBody').innerHTML = `<div class="card"><div class="big">📷 Čitam sliku…</div><div class="meta" id="ocrSt">Pripremam (prvi put skida dio za čitanje, treba internet)</div><div class="prog"><i id="ocrP"></i></div></div>`;
  $('#dlg').showModal();
  try {
    const img = await ucitajSliku(file);
    b.slika = canvasIz(img, 1100, false).toDataURL('image/jpeg', 0.68);
    let r = null;
    try {
      const txt = await ocr(canvasIz(img, 2200, true), (p, st) => {
        if (p >= 0) { $('#ocrP').style.width = Math.round(p * 100) + '%'; $('#ocrSt').textContent = 'Čitam tekst… ' + Math.round(p * 100) + '%'; }
        else if (st) $('#ocrSt').textContent = 'Pripremam: ' + st;
      });
      r = procitajCopart(txt, Object.keys(S.transport));
      b._ocrTxt = txt;
    } catch (e) {
      b._ocrWarn = '⚠️ Čitanje slike nije uspjelo (vjerovatno nema interneta za prvo pokretanje). Slika je sačuvana — upiši podatke ručno.';
    }
    if (r) {
      Object.assign(b, { lot: r.lot || '', vozilo: r.vozilo || '', lokacija: r.lokacija || '', maxBid: r.maxBid, datumUtc: r.datumUtc, vatNaCijenu: r.vatNaCijenu });
      const fali = [];
      if (!r.lot) fali.push('broj lota'); if (!r.vozilo) fali.push('vozilo'); if (!r.lokacija) fali.push('lokaciju'); if (!r.datumUtc) fali.push('datum'); if (r.maxBid == null) fali.push('max bid');
      if (fali.length) b._ocrWarn = '✏️ Nisam pročitao: <b>' + fali.join(', ') + '</b>. Dopuni ručno pa sačuvaj.';
      else b._ocrWarn = '✅ Sve pročitano — provjeri pa sačuvaj.';
      if (r.winning) b.napomena = 'Na slici: Winning' + (r.trenutniBid ? ', trenutni bid £' + r.trenutniBid : '');
      if (r.lot && BIDOVI.find(x => x.lot === r.lot)) b._ocrWarn = `⚠️ Lot ${r.lot} već imaš u listi! ` + b._ocrWarn;
    }
    otvori(b, true);
  } catch (e) {
    $('#dlg').close(); toast('Ne mogu otvoriti sliku');
  }
}

// Slika podijeljena iz galerije (Podijeli → Moji bidovi)
async function provjeriShare() {
  if (!location.search.includes('share=1') || !('caches' in window)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const c = await caches.open('share'); const r = await c.match('shared-image');
    if (r) { const blob = await r.blob(); await c.delete('shared-image'); obradiSliku(blob); }
  } catch (e) { }
}

// ===== PODEŠAVANJA UI =====
const POLJA_EXCEL = [['globalBank', 'Provizija Global – bank (£)'], ['globalCash', 'Provizija Global – keš (£)'], ['tecajCash', 'Tečaj £/€ – keš'], ['tecajBankRazlika', 'Bank tečaj = keš +'], ['prijevozBank', 'Prijevoz do BiH – bank (€)'], ['prijevozCash', 'Prijevoz do BiH – keš (€)'], ['homologacija', 'Homologacija + VIN (€)'], ['ostali', 'Ostali troškovi (€)'], ['carinaPosto', 'Carina (%)'], ['pdvPosto', 'PDV (%)'], ['osnovicaDodatak', 'Dodatak osnovici (€)'], ['bankFaktor', 'Faktor uplate bankom'], ['kesDijelilac', 'Keš: banka podijeljeno sa'], ['kesDodatak', 'Keš dodatak (€)'], ['kmKurs', 'Kurs € → KM']];
const POLJA_COPART = [['lotRetrieval', 'Lot retrieval fee (£)'], ['ukVat', 'UK VAT (%)']];
function poljaHTML(arr) { return arr.map(([k, l]) => `<div><label>${l}</label><input type="number" step="any" inputmode="decimal" data-k="${k}" value="${S[k]}"></div>`).join(''); }
function parovi(id, arr, a, b) {
  $(id).innerHTML = arr.map((p, i) => `<div class="kv"><input type="number" inputmode="decimal" data-i="${i}" data-j="0" value="${p[0]}" placeholder="${a}"><input type="number" inputmode="decimal" data-i="${i}" data-j="1" value="${p[1]}" placeholder="${b}"><button class="btn sm r" data-x="${i}">✕</button></div>`).join('');
  $(id).querySelectorAll('input').forEach(inp => inp.onchange = () => { arr[+inp.dataset.i][+inp.dataset.j] = +inp.value; saveS(); });
  $(id).querySelectorAll('[data-x]').forEach(x => x.onclick = () => { arr.splice(+x.dataset.x, 1); saveS(); renderPod(); });
}
function renderPod() {
  $('#podExcel').innerHTML = poljaHTML(POLJA_EXCEL);
  $('#podCopart').innerHTML = poljaHTML(POLJA_COPART);
  document.querySelectorAll('[data-k]').forEach(i => i.onchange = () => { S[i.dataset.k] = +i.value; saveS(); toast('Sačuvano'); });
  S.buyerFee.sort((a, b) => a[0] - b[0]); S.internetFee.sort((a, b) => a[0] - b[0]);
  parovi('#podBuyer', S.buyerFee, 'bid £', 'fee £');
  parovi('#podNet', S.internetFee, 'od £', 'fee £');
  const lok = Object.keys(S.transport).sort();
  $('#podTr').innerHTML = lok.map(k => `<div class="kv"><input value="${esc(k)}" disabled style="flex:2"><input type="number" inputmode="decimal" data-t="${esc(k)}" value="${S.transport[k]}"><button class="btn sm r" data-tx="${esc(k)}">✕</button></div>`).join('');
  $('#podTr').querySelectorAll('[data-t]').forEach(i => i.onchange = () => { S.transport[i.dataset.t] = +i.value; saveS(); });
  $('#podTr').querySelectorAll('[data-tx]').forEach(x => x.onclick = () => { if (confirm('Obrisati ' + x.dataset.tx + '?')) { delete S.transport[x.dataset.tx]; saveS(); renderPod(); } });
  $('#trDef').value = S.transportDefault; $('#trDef').onchange = () => { S.transportDefault = +$('#trDef').value; saveS(); };
  $('#delDays').value = S.obrisiPoslijeDana; $('#delDays').onchange = () => { S.obrisiPoslijeDana = +$('#delDays').value || 3; saveS(); };
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => $('#storeInfo').textContent = `Zauzeto: ${(e.usage / 1048576).toFixed(1)} MB · ${BIDOVI.length} bidova`);
}
$('#addBuyer').onclick = () => { S.buyerFee.push([0, 0]); saveS(); renderPod(); };
$('#addNet').onclick = () => { S.internetFee.push([0, 0]); saveS(); renderPod(); };
$('#addTr').onclick = () => { const n = (prompt('Naziv Copart lokacije (npr. WESTBURY):') || '').trim().toUpperCase(); if (!n) return; const v = +prompt('Transport do Globala (£):', '250'); if (v > 0) { S.transport[n] = v; saveS(); renderPod(); } };
$('#resetSet').onclick = () => { if (confirm('Vratiti sva podešavanja na početna? (bidovi ostaju)')) { localStorage.removeItem('cb_set'); loadS(); renderPod(); toast('Vraćeno'); } };
$('#wipe').onclick = async () => { if (confirm('Obrisati SVE bidove i slike? Ovo se ne može vratiti.')) { await tx('readwrite', st => st.clear()); await ucitaj(); render(); renderPod(); toast('Sve obrisano'); } };
$('#exp').onclick = () => {
  const data = JSON.stringify({ app: 'copart-bidovi', verzija: 1, datum: new Date().toISOString(), podesavanja: S, bidovi: BIDOVI });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const d = new Date(); a.download = `copart-bidovi-backup-${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}.json`; a.click();
  toast('Backup izvezen');
};
$('#impBtn').onclick = () => $('#imp').click();
$('#imp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'copart-bidovi') throw 0;
    if (confirm(`Uvesti ${d.bidovi.length} bidova${d.podesavanja ? ' i podešavanja' : ''}? Postojeći s istim ID se zamjenjuju.`)) {
      for (const b of d.bidovi) await sacuvaj(b);
      if (d.podesavanja) { S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), d.podesavanja); saveS(); }
      await ucitaj(); render(); renderPod(); toast('Uvezeno ✅');
    }
  } catch (err) { toast('Neispravan backup fajl'); }
};

// ===== START =====
(async () => {
  await openDB(); await ucitaj(); await auto_brisanje(); render();
  puniLokacije($('#kLok'), 'SANDY');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  provjeriShare();
  setInterval(async () => { await auto_brisanje(); render(); }, 60 * 60 * 1000);
  setInterval(() => { if (!$('#dlg').open) render(); }, 60 * 1000);
})();
</script>
